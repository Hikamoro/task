version: "2"
sql:
  - engine: "mysql"
    queries: "db/queries"
    schema: "migrations"
    gen:
      go:
        package: "sqlc"
        out: "internal/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "json"
            go_type:
              type: "string"
            nullable: true
          - db_type: "json"
            go_type:
              type: "string"
